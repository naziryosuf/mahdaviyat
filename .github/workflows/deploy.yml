name: Fast Vercel Auto-Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Verify Build Fast
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Trigger Vercel Instant Deployment
        run: |
          HOOK_URL="${{ secrets.VERCEL_DEPLOY_HOOK }}"
          if [ -z "$HOOK_URL" ]; then
            HOOK_URL="https://api.vercel.com/v1/integrations/deploy/prj_axwAR7QPBZGJSJHpNNoBArkSmtjd/n55WEtnv8g"
          fi
          echo "Triggering Vercel Deploy Hook..."
          curl -X POST "$HOOK_URL"
